version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ecommerce_api_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce_api_development}
      POSTGRES_USER: ${DB_USER:-ecommerce_api}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ecommerce_api} -d ${DB_NAME:-ecommerce_api_development}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: